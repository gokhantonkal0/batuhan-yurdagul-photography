tal, Nişan ve Nikah paketlerinin ilan edilen kapsamlarında drone çekimi bulunmaz.`],[`Sinematik klip ve Reels çekimi dahil mi?`,`Dijital, Standart ve Nişan paketlerinde 1,5 dakikalık; Nikah 1 paketinde 1–1,5 dakikalık sinematik klip vardır. Dijital ve Nişan paketleri ayrıca 2 akım Reels çekimi içerir. Gelin Alma ve Düğün Hikayesi paketlerinin klip kapsamı paket kartlarında belirtilmiştir.`],[`Nikah 1 ve Nikah 2 arasındaki fark nedir?`,`Nikah 1, fotoğraf çekimi ve 1–1,5 dakikalık sinematik klip içerir. Nikah 2, fotoğraf ve kamera çekimi ile kamera görüntülerinin teslimini içerir. Her ikisinde de nikah sonrası davetlilerle fotoğraf çekimi ve dijital arşiv bulunur.`],[`Fotoğraf, klip ve albümler ne zaman teslim edilir?`,`Teslim takvimini seçtiğiniz paketin içeriğine göre rezervasyon görüşmesinde birlikte netleştiriyoruz. Çekim öncesinde dijital fotoğraf, klip ve albüm için ayrı ayrı teslim bilgisi alabilirsiniz.`],[`Kapora, taksit ve iptal koşulları nedir?`,`Ödeme yöntemi, kapora ve tarih değişikliği veya iptal koşullarını rezervasyon kesinleşmeden önce WhatsApp üzerinden öğrenebilirsiniz. Site üzerinden ödeme alınmaz.`],[`Saç ve makyaj hizmeti paketlere dahil mi?`,`Saç ve makyaj temel paketlere dahil değildir; rezervasyon adımında ücretli ek hizmet olarak seçilebilir. Düğün Hikayesi paketindeki kuaför çekimi ise hazırlık anlarınızın fotoğraf ve klip kaydını ifade eder.`]],Yd=[{id:`incek`,name:`İncek Boğaz Plato`,photos:[`./gallery/incek-bd41d4a2a07a303d.jpg`]},{id:`no25`,name:`No 25 Plato`,photos:`./gallery/no25-049dd878796c42a3.jpg,./gallery/no25-1fa4a8f7ef5ab494.jpg,./gallery/no25-241554869ca59155.jpg,./gallery/no25-25dd20eac7e3af1b.jpg,./gallery/no25-454777ce5d8e5946.jpg,./gallery/no25-615f1419e1e28256.jpg,./gallery/no25-630e60bdbc1a212a.jpg,./gallery/no25-67b30185863302bb.jpg,./gallery/no25-70e0f6484225415f.jpg,./gallery/no25-74a02594d9621d7b.jpg,./gallery/no25-7cf41af320a38adf.jpg,./gallery/no25-7d545741ccda5aa8.jpg,./gallery/no25-81309c6b3cf02955.jpg,./gallery/n
